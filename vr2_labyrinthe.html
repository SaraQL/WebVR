<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-mixin id="contours" material="side:double" repeat="4 1" material="color:#f7d6c5" geometry="width:0.02; height:3"></a-mixin>
        <a-mixin id="haie_ligne" material="side:double" material="color:#f7d6c5" rotation="0 0 0" geometry="height:3"></a-mixin>
        <a-mixin id="haie_colonne" material="side:double" material="color:#f7d6c5" rotation="0 90 0" geometry="height:3"></a-mixin>
        
        <img id="paveTexture" src="./assets/images/pave.jpg">
        <img id="cielTexture" src="./assets/images/ciel2.jpg">
        <img id="contourTexture" src="./assets/Buissons/Buisson0.jpg">

        <img id=texture1 src="./assets/Buissons/Buisson0.jpg">
        <img id=texture2 src="./assets/Buissons/Buisson1.jpg">
        <img id=texture3 src="./assets/Buissons/Buisson2.jpg">
        <img id=texture4 src="./assets/Buissons/Buisson3.jpg">
        <img id=texture5 src="./assets/Buissons/Buisson4.jpg">
        <img id=texture6 src="./assets/Buissons/Buisson5.jpg">
        <img id=texture7 src="./assets/Buissons/Buisson6.jpg">*
        <img id=texture8 src="./assets/Buissons/Buisson7.jpg">
        <img id=texture9 src="./assets/Buissons/Buisson8.jpg">
        <img id=texture10 src="./assets/Buissons/Buisson9.jpg">
        <img id=texture11 src="./assets/Buissons/Buisson10.jpg">
        <img id=texture12 src="./assets/Buissons/Buisson11.jpg">
        <img id=texture13 src="./assets/Buissons/Buisson12.jpg">
        <img id=texture14 src="./assets/Buissons/Buisson13.jpg">
        <img id=texture15 src="./assets/Buissons/Buisson14.jpg">
        <img id=texture16 src="./assets/Buissons/Buisson15.jpg">
        <img id=texture17 src="./assets/Buissons/Buisson16.jpg">
        <img id=texture18 src="./assets/Buissons/Buisson17.jpg">
        <img id=texture19 src="./assets/Buissons/Buisson18.jpg">
        <img id=texture20 src="./assets/Buissons/Buisson19.jpg">
        <img id=texture21 src="./assets/Buissons/Buisson20.jpg">
        <img id=texture22 src="./assets/Buissons/Buisson21.jpg">
        <img id=texture23 src="./assets/Buissons/Buisson22.jpg">
      </a-assets>


      <a-entity position="0 0 2">
        <!-- les contours -->
        <a-box id="haie" src="#contourTexture" mixin="contours" position="-2 1.5 -2" depth="4"></a-box>
        <a-box id="haie" src="#contourTexture" mixin="contours" position="2 1.5 -2"  depth="4"></a-box>
        <a-box id="haie" src="#contourTexture" mixin="contours" position="0 1.5 -4" rotation="0 90 0" depth="4"></a-box>
        <a-box id="haie" src="#contourTexture" mixin="contours" position="-0.25 1.5 0.01" rotation="0 90 0" depth="3.5"></a-box>

        
        <!-- la haie -->
          <!-- 1ère ligne -->
            <a-plane id="haie" random-texture mixin="haie_ligne" position="0.75 1.5 -0.5" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="1.25 1.5 -0.5" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-0.25 1.5 -0.5" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-1.75 1.5 -0.5" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-1.25 1.5 -0.5" width="0.5"></a-plane>

          <!-- 2ème ligne   -->
            <a-plane id="haie" random-texture mixin="haie_ligne" position="1.75 1.5 -1" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="1.25 1.5 -1" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-0.25 1.5 -1" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-1.75 1.5 -1" width="0.5"></a-plane>

          <!-- 4ème ligne -->
            <a-plane id="haie" random-texture mixin="haie_ligne" position="1.25 1.5 -2" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-1.25 1.5 -2" width="0.5"></a-plane>

          <!-- 5ème ligne -->
            <a-plane id="haie" random-texture mixin="haie_ligne" position="1.25 1.5 -2.5" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="0.25 1.5 -2.5" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-0.25 1.5 -2.5" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-1.75 1.5 -2.5" width="0.5"></a-plane>
          
          <!-- 6ème ligne -->
            <a-plane id="haie" random-texture mixin="haie_ligne" position="1.75 1.5 -3" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="1.25 1.5 -3" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="0.25 1.5 -3" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-0.25 1.5 -3" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-0.75 1.5 -3" width="0.5"></a-plane>
          
          <!-- 7ème ligne --> 
            <a-plane id="haie" random-texture mixin="haie_ligne" position="0.75 1.5 -3.5" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_ligne" position="-0.25 1.5 -3.5" width="0.5"></a-plane>     
      
          
          <!-- 1ère colonne -->
            <a-plane id="haie" random-texture mixin="haie_colonne" position="1.5 1.5 -0.25" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="1.5 1.5 -2.25" width="0.5"></a-plane>

          <!-- 2ème colonne -->
            <a-plane id="haie" random-texture mixin="haie_colonne" position="1 1.5 -1.75" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="1 1.5 -1.25" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="1 1.5 -3.25" width="0.5"></a-plane>

          <!-- 3ème colonne -->
            <a-plane id="haie" random-texture mixin="haie_colonne" position="0.5 1.5 -0.75" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="0.5 1.5 -1.25" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="0.5 1.5 -1.75" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="0.5 1.5 -3.25" width="0.5"></a-plane>
          
          <!-- 4ème colonne -->
            <a-plane id="haie" random-texture mixin="haie_colonne" position="0 1.5 -0.75" width="0.5"></a-plane>
          
          <!-- 5ème colonne -->
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-0.5 1.5 -0.25" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-0.5 1.5 -1.75" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-0.5 1.5 -1.25" width="0.5"></a-plane>

            <a-plane id="haie" random-texture mixin="haie_colonne" position="-0.5 1.5 -2.75" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-0.5 1.5 -3.75" width="0.5"></a-plane>
          
          <!-- 6ème colonne -->
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-1 1.5 -1.25" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-1 1.5 -0.75" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-1 1.5 -3.25" width="0.5"></a-plane>
          
          <!-- 7ème colonne -->
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-1.5 1.5 -1.75" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-1.5 1.5 -1.25" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-1.5 1.5 -2.75" width="0.5"></a-plane>
            <a-plane id="haie" random-texture mixin="haie_colonne" position="-1.5 1.5 -3.75" width="0.5"></a-plane>

      <!-- l'environnement -->
        <a-plane id="pave" src="#paveTexture" repeat="4 4" material="color:#f7d6c5" position="0 0 -2" rotation="-90 0 0" width="4" height="4"></a-plane>
        <a-sky id="ciel" src="#cielTexture"></a-sky>
    </a-entity>
      <a-light type="ambient" color="pink"></a-light>
      <a-camera position="0 1.6 0" look-controls wasd-controls="acceleration:10"></a-camera>
      
      <script>
        AFRAME.registerComponent('random-texture', {
          init: function() {
              const textures = [
                document.getElementById('texture1'),
                document.getElementById('texture1'),
                document.getElementById('texture1'),
                document.getElementById('texture1'),
                document.getElementById('texture1'),
                document.getElementById('texture2'),
                document.getElementById('texture3'),
                document.getElementById('texture4'),
                document.getElementById('texture5'),
                document.getElementById('texture6'),
                document.getElementById('texture7'),
                document.getElementById('texture8'),
                document.getElementById('texture9'),
                document.getElementById('texture10'),
                document.getElementById('texture11'),
                document.getElementById('texture12'),
                document.getElementById('texture13'),
                document.getElementById('texture14'),
                document.getElementById('texture15'),
                document.getElementById('texture16'),
                document.getElementById('texture17'),
                document.getElementById('texture18'),
                document.getElementById('texture19'),
                document.getElementById('texture20'),
                document.getElementById('texture21'),
                document.getElementById('texture22'),
                document.getElementById('texture23'),
              ];
              const randomTexture = textures[Math.floor(Math.random() * textures.length)]; 
              this.el.setAttribute('material','src','#'+ randomTexture.id);
          }
        });
      </script>


      
    </a-scene>
  </body>

</html>
