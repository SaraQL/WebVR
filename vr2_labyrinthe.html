<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-mixin id="contours" material="side:double" repeat="2 2" material="color:#f7d6c5" geometry="width:0.02; height:3"></a-mixin>
        <a-mixin id="haie_ligne" material="side:double" repeat="1 3" material="color:#f7d6c5" rotation="0 0 0" geometry="height:3"></a-mixin>
        <a-mixin id="haie_colonne" material="side:double" repeat="1 3" material="color:#f7d6c5" rotation="0 90 0" geometry="height:3"></a-mixin>
        
        <img id="paveTexture" src="./assets/images/pave.jpg">
        <img id="haieTexture" src="./assets/images/buisson2.jpg">
        <img id="cielTexture" src="./assets/images/ciel2.jpg">
      </a-assets>


      <!-- les contours -->
      <a-box id="haie" src="#haieTexture" mixin="contours" position="-2 1.5 -2" depth="4"></a-box>
      <a-box id="haie" src="#haieTexture" mixin="contours" position="2 1.5 -2"  depth="4"></a-box>
      <a-box id="haie" src="#haieTexture" mixin="contours" position="0 1.5 -4" rotation="0 90 0" depth="4"></a-box>
      <a-box id="haie" src="#haieTexture" mixin="contours" position="-0.25 1.5 0.01" rotation="0 90 0" depth="3.5"></a-box>

      
      <!-- la haie -->
        <!-- 1ère ligne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="1 1.5 -0.5" width="1"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="-0.25 1.5 -0.5" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="-1.5 1.5 -0.5" width="1"></a-plane>
        <!-- 2ème ligne   -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="1.5 1.5 -1" width="1"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="-0.25 1.5 -1" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="-1.75 1.5 -1" width="0.5"></a-plane>

        <!-- 4ème ligne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="1.25 1.5 -2" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="-1.25 1.5 -2" width="0.5"></a-plane>

        <!-- 5ème ligne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="1.25 1.5 -2.5" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="0 1.5 -2.5" width="1"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="-1.75 1.5 -2.5" width="0.5"></a-plane>
        
        <!-- 6ème ligne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="1.5 1.5 -3" width="1"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="-0.25 1.5 -3" width="1.5"></a-plane>
        
        <!-- 7ème ligne --> 
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="0.75 1.5 -3.5" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_ligne" position="-0.25 1.5 -3.5" width="0.5"></a-plane>     
    
         
        <!-- 1ère colonne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="1.5 1.5 -0.25" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="1.5 1.5 -2.25" width="0.5"></a-plane>

        <!-- 2ème colonne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="1 1.5 -1.5" width="1"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="1 1.5 -3.25" width="0.5"></a-plane>

        <!-- 3ème colonne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="0.5 1.5 -1.25" width="1.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="0.5 1.5 -3.25" width="0.5"></a-plane>
        
        <!-- 4ème colonne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="0 1.5 -0.75" width="0.5"></a-plane>
        
        <!-- 5ème colonne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-0.5 1.5 -0.25" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-0.5 1.5 -1.5" width="1"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-0.5 1.5 -2.55" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-0.5 1.5 -3.75" width="0.5"></a-plane>
        
        <!-- 6ème colonne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-1 1.5 -1" width="1"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-1 1.5 -3.25" width="0.5"></a-plane>
        
        <!-- 7ème colonne -->
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-1.5 1.5 -1.5" width="1"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-1.5 1.5 -2.75" width="0.5"></a-plane>
          <a-plane id="haie" src="#haieTexture" mixin="haie_colonne" position="-1.5 1.5 -3.75" width="0.5"></a-plane>


    <!-- l'environnement -->
      <a-plane id="pave" src="#paveTexture" repeat="4 4" material="color:#f7d6c5" position="0 0 -2" rotation="-90 0 0" width="4" height="4"></a-plane>
      <a-sky id="ciel" src="#cielTexture"></a-sky>
      <a-light type="ambient" color="pink"></a-light>
      <a-camera position="0 1.6 0" look-controls wasd-controls="acceleration:10"></a-camera>
      
    </a-scene>
  </body>

</html>
