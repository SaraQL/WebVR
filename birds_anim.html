<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="flamingo" src="/assets/3Danims/birds/Flamingo.glb"></a-asset-item>
        <a-asset-item id="parrot" src="/assets/3Danims/birds/Parrot.glb"></a-asset-item>
        <a-asset-item id="strok" src="/assets/3Danims/birds/Stork.glb"></a-asset-item>
      </a-assets>

      <a-entity id="bird1" position="0 1 -5">
        <a-entity gltf-model="#flamingo" animation-mixer rotation="0 -90 0" position="0 0 0" scale="1 1 1"></a-entity>
      </a-entity>

      <a-entity id="bird2" position="1 2 -5">
        <a-entity gltf-model="#parrot" animation-mixer rotation="0 -90 0" position="0 0 0" scale="1 1 1"></a-entity>
      </a-entity>

      <a-entity id="bird3" position="3 2 -5"></a-entity>>
        <a-entity gltf-model="#strok" animation-mixer rotation="0 -90 0" position="3 2 -5" scale="1 1 1"></a-entity>
      </a-entity>


      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
