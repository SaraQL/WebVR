<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene background="color:skyblue">
      <a-asset-item id="tree-obj" src="assets/3Dmodels/exp2_obj_lowpoly_tree/Lowpoly_tree_sample.obj"></a-asset-item>
      <a-asset-item id="tree-mtl" src="assets/3Dmodels/exp2_obj_lowpoly_tree/Lowpoly_tree_sample.mtl"></a-asset-item>
      
      <a-entity obj-model="obj: #tree-obj; mtl: #tree-mtl" position="0 0 -1" scale="0.1 0.1 0.1"></a-entity>

      <a-plane position="0 0 0" material="side:double" rotation="90 0 0" width="4" height="4" color="blanc"></a-plane>

      <a-camera position="0 1.6 0" look-controls wasd-controls></a-camera>
      <!-- <a-entity position="0 1.6 0" camera="active: true" look-controls wasd-controls data-aframe-default-camera></a-entity> -->
    </a-scene>
  </body>
</html>
